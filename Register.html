<!doctype html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #162033;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 24px; }
      main {
        width: min(100%, 520px);
        margin: 24px auto;
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 16px 50px rgba(23, 52, 85, 0.14);
        padding: 34px 28px;
      }
      .mark {
        width: 58px; height: 58px; display: grid; place-items: center;
        margin: 0 auto 18px; border-radius: 18px; background: #e7f1fb;
        color: #1f65a6; font-size: 28px; font-weight: 800;
      }
      h1, .intro { text-align: center; }
      h1 { margin: 0 0 10px; font-size: 25px; }
      h2 { margin: 0 0 10px; font-size: 22px; }
      p { color: #5d6878; line-height: 1.5; }
      label { display: block; margin: 18px 0 7px; font-weight: 700; }
      input[type="text"], input[type="email"], input[type="tel"] {
        width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid #b8c2cf;
        border-radius: 10px; font: inherit;
      }
      input:focus { outline: 3px solid #cfe5f8; border-color: #1769aa; }
      fieldset { margin: 20px 0 0; padding: 0; border: 0; }
      legend { font-weight: 700; margin-bottom: 9px; }
      .choice { display: inline-flex; align-items: center; gap: 7px; margin-right: 20px; }
      button {
        width: 100%; min-height: 54px; margin-top: 24px; border: 0; border-radius: 14px;
        background: #1769aa; color: white; font: inherit; font-size: 18px;
        font-weight: 700; cursor: pointer;
      }
      button:disabled { opacity: .6; cursor: wait; }
      .hidden, .website-field { display: none; }
      .status { margin-top: 24px; padding: 18px; border-radius: 14px; background: #eaf7ef; color: #17633a; }
      .status.error { background: #fff0f0; color: #9d2525; }
      .instructions { margin-top: 18px; padding-top: 14px; border-top: 1px solid #d9e1e9; }
      .instructions li { margin: 9px 0; color: #465468; line-height: 1.4; }
      .small { font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">+</div>
      <h1><?= organizationName ?></h1>
      <p class="intro">Register once to receive your private check-in link.</p>

      <? if (registrationEnabled) { ?>
        <form id="registrationForm" onsubmit="submitRegistration(event)">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>

          <fieldset>
            <legend>Send my link by</legend>
            <label class="choice"><input type="radio" name="deliveryMethod" value="email" checked onchange="updateDeliveryFields()"> Email</label>
            <? if (smsEnabled) { ?>
              <label class="choice"><input type="radio" name="deliveryMethod" value="sms" onchange="updateDeliveryFields()"> Text message</label>
            <? } else { ?>
              <span class="small">Text-message delivery is not configured yet.</span>
            <? } ?>
          </fieldset>

          <div id="emailField">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          </div>

          <div id="phoneField" class="hidden">
            <label for="phone">Mobile number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="3125551234">
            <p class="small">U.S. numbers may use 10 digits. Other countries should include + and the country code.</p>
          </div>

          <div class="website-field" aria-hidden="true">
            <label for="website">Website</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <button id="registerButton" type="submit">Create My Check-In Link</button>
        </form>
        <div id="status" class="status hidden" role="status" aria-live="polite"></div>
      <? } else { ?>
        <div class="status error">
          <h2>Registration is currently closed</h2>
          <p>Please contact an administrator.</p>
        </div>
      <? } ?>
    </main>

    <script>
      function updateDeliveryFields() {
        const method = document.querySelector('input[name="deliveryMethod"]:checked').value;
        const emailField = document.getElementById('emailField');
        const phoneField = document.getElementById('phoneField');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        emailField.classList.toggle('hidden', method !== 'email');
        phoneField.classList.toggle('hidden', method !== 'sms');
        email.required = method === 'email';
        phone.required = method === 'sms';
      }

      function submitRegistration(event) {
        event.preventDefault();
        const form = document.getElementById('registrationForm');
        const button = document.getElementById('registerButton');
        const status = document.getElementById('status');
        const data = Object.fromEntries(new FormData(form).entries());
        button.disabled = true;
        button.textContent = 'Creating your link…';
        status.className = 'status hidden';

        google.script.run
          .withSuccessHandler(showRegistrationResult)
          .withFailureHandler(function () {
            showRegistrationResult({ok: false, message: 'We could not complete your registration. Please try again.'});
          })
          .registerPerson(data);
      }

      function showRegistrationResult(result) {
        const form = document.getElementById('registrationForm');
        const button = document.getElementById('registerButton');
        const status = document.getElementById('status');
        status.className = 'status' + (result.ok ? '' : ' error');

        if (result.ok) {
          form.className = 'hidden';
          status.innerHTML =
            '<h2>Registration complete</h2>' +
            '<p>' + escapeText(result.message) + '</p>' +
            '<p class="small">Sent to ' + escapeText(result.destination) + '</p>' +
            '<div class="instructions"><strong>When your link arrives:</strong><ul>' +
            '<li><strong>iPhone/iPad:</strong> open it in Safari, tap Share, then Add to Home Screen or Add Bookmark.</li>' +
            '<li><strong>Android:</strong> open it in Chrome, open the menu, then Add to Home screen or Bookmark.</li>' +
            '<li><strong>Computer:</strong> bookmark it in your browser.</li>' +
            '</ul><p>Keep your link private. Open it when you arrive and tap <strong>Check In</strong>.</p></div>';
        } else {
          status.textContent = result.message;
          button.disabled = false;
          button.textContent = 'Create My Check-In Link';
        }
      }

      function escapeText(value) {
        const span = document.createElement('span');
        span.textContent = value || '';
        return span.innerHTML;
      }
    </script>
  </body>
</html>
