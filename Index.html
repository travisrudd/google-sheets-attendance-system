<!doctype html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #162033;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 440px);
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 16px 50px rgba(23, 52, 85, 0.14);
        padding: 34px 28px;
        text-align: center;
      }
      .mark {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        border-radius: 18px;
        background: #e7f1fb;
        color: #1f65a6;
        font-size: 30px;
        font-weight: 800;
      }
      h1 { margin: 0 0 10px; font-size: 25px; }
      h2 { margin: 24px 0 4px; font-size: 22px; }
      p { margin: 8px 0; color: #5d6878; line-height: 1.5; }
      .date {
        margin: 20px 0 24px;
        padding: 14px;
        background: #f5f8fc;
        border-radius: 12px;
        color: #344258;
        font-weight: 600;
      }
      button {
        width: 100%;
        min-height: 54px;
        border: 0;
        border-radius: 14px;
        background: #1769aa;
        color: white;
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .hidden { display: none; }
      .status {
        margin-top: 24px;
        padding: 18px;
        border-radius: 14px;
        background: #eaf7ef;
        color: #17633a;
      }
      .status.error { background: #fff0f0; color: #9d2525; }
      .status h2 { margin: 0 0 6px; }
      .small { font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">✓</div>
      <h1><?= organizationName ?></h1>

      <? if (valid) { ?>
        <p>Welcome</p>
        <h2><?= personName ?></h2>
        <div class="date"><?= todayLabel ?></div>
        <button id="checkInButton" onclick="submitCheckIn()">Check In</button>
        <div id="status" class="status hidden" role="status" aria-live="polite"></div>
      <? } else { ?>
        <div class="status error">
          <h2>Unable to check in</h2>
          <p><?= errorMessage ?></p>
        </div>
      <? } ?>
    </main>

    <script>
      const TOKEN = <?!= JSON.stringify(token) ?>;

      function submitCheckIn() {
        const button = document.getElementById('checkInButton');
        const status = document.getElementById('status');
        button.disabled = true;
        button.textContent = 'Checking in…';
        status.className = 'status hidden';

        google.script.run
          .withSuccessHandler(showResult)
          .withFailureHandler(function () {
            showResult({
              ok: false,
              message: 'We could not record your check-in. Please try again.',
            });
          })
          .checkIn(TOKEN);
      }

      function showResult(result) {
        const button = document.getElementById('checkInButton');
        const status = document.getElementById('status');
        status.className = 'status' + (result.ok ? '' : ' error');

        const title = document.createElement('h2');
        title.textContent = result.message;
        status.replaceChildren(title);

        if (result.date) {
          const detail = document.createElement('p');
          detail.className = 'small';
          detail.textContent = result.date + (result.time ? ' · ' + result.time : '');
          status.appendChild(detail);
        }

        if (result.ok) {
          button.className = 'hidden';
        } else {
          button.disabled = false;
          button.textContent = 'Try Again';
        }
      }
    </script>
  </body>
</html>
